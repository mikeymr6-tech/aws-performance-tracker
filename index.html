<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#006fb9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="AWS Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="all-weather-seal-logo.jpeg">
<title>AWS Performance Tracker</title>
<style>
:root{--blue:#006fb9;--dark:#00539b;--pale:#eaf4fb;--ink:#17324d;--muted:#6c7a86}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f8fa;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
button,input{font:inherit}
.app{max-width:620px;margin:auto;min-height:100vh;background:white}
header{height:74px;background:var(--blue);color:white;display:flex;align-items:center;padding:8px 14px;gap:12px;position:sticky;top:0;z-index:5}
header img{width:54px;height:54px;object-fit:contain;background:white;border-radius:8px}
header .title{font-weight:800;font-size:17px;letter-spacing:.3px}
header small{display:block;opacity:.85;font-weight:500;margin-top:2px}
main{padding:16px 14px 28px}
.card{background:white;border:1px solid #dbe5eb;border-radius:18px;padding:15px;box-shadow:0 2px 10px #0b416b0d;margin-bottom:12px}
.login{text-align:center;padding-top:35px}
.login img{width:175px;height:175px;object-fit:contain}
h1{font-size:25px;margin:12px 0 5px;color:var(--dark)}
.sub{color:var(--muted);font-size:14px}
label{display:block;text-align:left;font-weight:700;font-size:13px;margin:12px 0 6px}
input{width:100%;border:1px solid #cbd8df;border-radius:12px;padding:13px;background:white;color:var(--ink);outline:none}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #006fb922}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:800;cursor:pointer}
.primary{background:var(--dark);color:white}.secondary{background:#edf4f8;color:var(--dark)}
.btn:disabled{opacity:.45}
.goal{background:var(--pale);border-radius:16px;padding:14px;margin-bottom:12px}
.goal-title{font-size:12px;font-weight:800;color:var(--dark);letter-spacing:.7px}
.goal-value{font-size:28px;font-weight:850;margin-top:2px}
.progress{height:9px;border-radius:10px;background:#d5e4ed;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:var(--blue);width:0%}
.button-card{text-align:center;background:#f5f9fc;border:1px solid #d7e4eb}
.metric-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.metric-log{min-height:62px;border:0;border-radius:14px;background:white;border:1px solid #dbe5eb;color:#17324d;font-weight:800;font-size:14px;box-shadow:0 2px 7px #0b416b0d}
.metric-log:active{transform:scale(.97);background:#eaf4fb}
.metric-log .metric-count{display:block;font-size:22px;color:#006fb9;margin-top:3px}
.metric-list{display:grid;gap:8px;margin-top:12px}
.metric{display:flex;align-items:center;border:1px solid #dbe5eb;border-radius:14px;padding:10px 12px}
.metric .name{flex:1;font-weight:750}.metric .count{font-size:21px;font-weight:850;color:var(--dark);min-width:40px;text-align:right}
.small-btn{width:38px;height:38px;border:0;border-radius:11px;background:#edf4f8;color:var(--dark);font-size:20px;margin-left:8px}
.end{width:100%;margin-top:12px;background:var(--dark);color:white}
.hidden{display:none!important}
.notice{background:#fff8e8;border:1px solid #f0d18b;color:#765600;padding:11px 12px;border-radius:12px;font-size:12px;line-height:1.4}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#17324d;color:white;padding:11px 15px;border-radius:14px;z-index:20;box-shadow:0 8px 24px #0003}
@media (min-width:700px){body{padding:20px 0}.app{border-radius:22px;overflow:hidden;box-shadow:0 10px 40px #0b416b18}}
@media print{
 body{background:white}.no-print,header{display:none!important}.app{max-width:none;box-shadow:none}
 .print-report{display:block!important;padding:20px}.print-report img{width:100px}
}
.print-report{display:none}
</style>
</head>
<body>
<div class="app">
<header id="appHeader" class="hidden">
  <img src="all-weather-seal-logo.jpeg" alt="All-Weather Seal">
  <div><div class="title">AWS PERFORMANCE TRACKER</div><small id="headerName"></small></div>
</header>

<main id="loginScreen" class="login">
  <img src="all-weather-seal-logo.jpeg" alt="All-Weather Seal logo">
  <h1>AWS Performance Tracker</h1>
  <div class="sub">Quick, one-handed shift tracking</div>
  <div class="card" style="margin-top:22px">
    <label for="loginName">Name *</label>
    <input id="loginName" autocomplete="name" placeholder="Enter your name">
    <label for="loginEmail">Email Address *</label>
    <input id="loginEmail" type="email" autocomplete="email" placeholder="Enter your email address">
    <button id="startBtn" class="btn primary" style="width:100%;margin-top:18px">START SHIFT</button>
    <div class="sub" style="margin-top:10px">No password required.</div>
  </div>
</main>

<main id="dashboard" class="hidden no-print">
  <div class="card">
    <div class="row">
      <div><label for="store">Store</label><input id="store" placeholder="Store / location"></div>
      <div style="max-width:125px"><label for="setGoal">Set Goal</label><input id="setGoal" inputmode="numeric" value="10"></div>
    </div>
  </div>

  <div class="goal">
    <div class="goal-title">SET GOAL</div>
    <div class="goal-value"><span id="setCount">0</span> / <span id="goalValue">10</span></div>
    <div class="progress"><i id="progressBar"></i></div>
  </div>

  <div class="card button-card">
    <div class="wheel-title">LOG CUSTOMER METRICS</div>
    <div class="sub" style="margin-top:4px">Tap a metric to add one tally.</div>
    <div class="metric-buttons" id="metricButtons"></div>
  </div>
  <button id="endShift" class="btn end">END SHIFT &amp; DOWNLOAD PDF</button>
</main>

<section id="printReport" class="print-report">
  <img src="all-weather-seal-logo.jpeg" alt="All-Weather Seal">
  <h1>PERFORMANCE TALLY SHEET</h1>
  <div id="printMeta"></div>
  <div id="printTable"></div>
</section>
</div>

<div id="toast" class="toast hidden"></div>

<script>
const METRICS=["Product Picked","Need Building","Value of Visit","Note Taking","Scheduling","Confirmation Call","Set","ND","CTS"];
let counts=Object.fromEntries(METRICS.map(m=>[m,0]));
let user={name:"",email:"",store:"",goal:10};
let selected=0, dragStart=0, accumulated=0, dragging=false;
const $=id=>document.getElementById(id);

function showToast(msg){$("toast").textContent=msg;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),1300)}
function save(){localStorage.setItem("awsTracker",JSON.stringify({user,counts}))}
function load(){
 const x=localStorage.getItem("awsTracker"); if(!x)return;
 try{const d=JSON.parse(x);user={...user,...d.user};counts={...counts,...d.counts}}catch(e){}
}
function render(){
 $("headerName").textContent=user.name;
 $("store").value=user.store; $("setGoal").value=user.goal;
 $("goalValue").textContent=user.goal;
 $("setCount").textContent=counts.Set;
 $("progressBar").style.width=Math.min(100,(counts.Set/Math.max(1,user.goal))*100)+"%";
 $("metricList").innerHTML=METRICS.map(m=>`
  <div class="metric"><div class="name">${m}</div><div class="count">${counts[m]}</div>
  <button class="small-btn" data-sub="${m}" aria-label="Subtract ${m}">−</button></div>`).join("");
 document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{const m=b.dataset.sub;counts[m]=Math.max(0,counts[m]-1);save();render()});
 renderButtons();
}
function renderButtons(){
 $("metricButtons").innerHTML=METRICS.map(m=>`
   <button class="metric-log" data-log="${m}">
     ${m}<span class="metric-count">${counts[m]}</span>
   </button>`).join("");
 document.querySelectorAll("[data-log]").forEach(b=>b.onclick=()=>{
   const m=b.dataset.log; counts[m]++; save(); render(); showToast("Logged: "+m);
   if(navigator.vibrate) navigator.vibrate(12);
 });
}
$("startBtn").onclick=()=>{
 const name=$("loginName").value.trim(),email=$("loginEmail").value.trim();
 if(!name||!email||!$("loginEmail").checkValidity()){showToast("Enter your name and a valid email.");return}
 user.name=name;user.email=email;user.store="";user.goal=10;
 counts=Object.fromEntries(METRICS.map(m=>[m,0]));
 localStorage.setItem("awsTracker",JSON.stringify({user,counts}));
 $("loginScreen").classList.add("hidden");$("appHeader").classList.remove("hidden");$("dashboard").classList.remove("hidden");render();
};
$("store").oninput=e=>{user.store=e.target.value;save()};
$("setGoal").oninput=e=>{user.goal=Math.max(0,parseInt(e.target.value||"0",10));save();render()};

function tallyMarks(n){
 let out="";for(let i=0;i<n;i++){out += "I"; if((i+1)%5===0) out+="̸";}return out||"—";
}
$("endShift").onclick=()=>{
 $("printMeta").innerHTML=`<p><b>Employee:</b> ${user.name} &nbsp;&nbsp; <b>Store:</b> ${user.store||"—"} &nbsp;&nbsp; <b>Date:</b> ${new Date().toLocaleDateString()}</p>
 <p><b>Email:</b> ${user.email} &nbsp;&nbsp; <b>Set Goal:</b> ${user.goal}</p>`;
 $("printTable").innerHTML=`<table style="width:100%;border-collapse:collapse;font-size:15px">
 <tr style="background:#006fb9;color:white"><th style="padding:10px;text-align:left">CATEGORY</th><th style="padding:10px;text-align:left">ACTUAL / TALLY</th><th style="padding:10px">TOTAL</th></tr>
 ${METRICS.map(m=>`<tr><td style="border:1px solid #006fb9;padding:12px;font-weight:700">${m}</td><td style="border:1px solid #006fb9;padding:12px;font-family:monospace;letter-spacing:2px">${tallyMarks(counts[m])}</td><td style="border:1px solid #006fb9;padding:12px;text-align:center;font-weight:800">${counts[m]}</td></tr>`).join("")}</table>`;
 document.title="AWS Performance Tally Sheet";
 window.print();
};

// Restore session if present.
load();
if(user.name&&user.email){
 $("loginScreen").classList.add("hidden");$("appHeader").classList.remove("hidden");$("dashboard").classList.remove("hidden");render();
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
</script>
</body>
</html>
